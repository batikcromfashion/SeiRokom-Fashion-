<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>পছন্দের তালিকা — SeiRokom Fashion</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#111111;
    --gold:#c9a24a;
    --gold-light:#e9cd8b;
    --gold-deep:#8a6a26;
    --cream:#faf8f4;
    --white:#ffffff;
    --ink:#1a1a1a;
    --border:#e9e4d8;
    --maxw:1180px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--white);
    color:var(--ink);
    font-family:'Hind Siliguri', sans-serif;
    line-height:1.7;
  }
  h1,h2,h3{ font-family:'Tiro Bangla', serif; font-weight:400; }
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 24px;}
  
  /* Header Nav */
  header{ position:sticky; top:0; z-index:50; background:var(--black); }
  .nav{ display:flex; align-items:center; justify-content:space-between; padding:12px 24px; max-width:var(--maxw); margin:0 auto; }
  .brand-block{display:flex; align-items:center; gap:10px;}
  .brand-logo{width:40px; height:40px; border-radius:50%; overflow:hidden; border:1px solid var(--gold);}
  .brand-logo img{width:100%; height:100%; object-fit:cover;}
  .brand-text{display:flex; flex-direction:column; line-height:1.2;}
  .brand-text .bn{font-family:'Tiro Bangla', serif; font-size:1.08rem; color:var(--gold-light);}
  .brand-text .en{font-size:0.58rem; letter-spacing:1px; color:#c9a24a;}
  .nav-links{display:flex; align-items:center; gap:26px; font-size:0.92rem; color:#cfc9ba;}
  .nav-links a:hover{color:var(--gold-light);}

  /* Wishlist Section */
  .wishlist-section{ padding:50px 0; background:var(--cream); min-height:80vh; }
  .page-title{ margin-bottom:30px; font-size:1.8rem; color:var(--black); text-align:center; }
  .wish-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:20px; }
  @media(max-width:860px){ .wish-grid{ grid-template-columns:repeat(2, 1fr); } }
  @media(max-width:560px){ .wish-grid{ grid-template-columns:1fr; } }

  .wish-card{ background:#fff; border:1px solid var(--border); border-radius:10px; overflow:hidden; transition:transform .2s ease; position:relative; }
  .wish-card:hover{ transform:translateY(-3px); }
  .wish-img{ aspect-ratio:1/1; background:#f4f0e4; display:grid; place-items:center; font-size:2.5rem; position:relative; }
  .wish-remove{ position:absolute; top:10px; right:10px; background:rgba(0,0,0,0.6); color:#fff; border:none; width:28px; height:28px; border-radius:50%; cursor:pointer; font-size:0.8rem; }
  .wish-body{ padding:16px; }
  .wish-title{ font-size:1rem; font-weight:600; margin-bottom:4px; }
  .wish-price{ color:var(--gold-deep); font-weight:700; font-size:1.05rem; margin-bottom:12px; }
  .btn-move-cart{ display:block; width:100%; text-align:center; background:var(--black); color:#fff; padding:10px; border-radius:6px; font-size:0.85rem; font-weight:600; }
  .btn-move-cart:hover{ background:var(--gold-deep); }

  /* Footer */
  footer{ background:var(--black); color:#888; text-align:center; padding:20px; font-size:0.8rem; border-top:1px solid rgba(201,162,74,0.2); }
</style>
</head>
<body>

<header>
  <div class="nav">
    <a href="index.html" class="brand-block">
      <div class="brand-logo"><img src="favicon-192x192.png" alt="SeiRokom"></div>
      <div class="brand-text">
        <span class="bn">সেইরকম ফ্যাশন</span>
        <span class="en">SEIROKOM FASHION</span>
      </div>
    </a>
    <div class="nav-links">
      <a href="index.html">হোম</a>
      <a href="wishlist.html" style="color:var(--gold-light)">পছন্দের তালিকা</a>
      <a href="cart.html">কার্ট</a>
    </div>
  </div>
</header>

<div class="wishlist-section">
  <div class="wrap">
    <h1 class="page-title">আপনার পছন্দের তালিকা (Wishlist)</h1>
    
    <div class="wish-grid">
      <div class="wish-card">
        <div class="wish-img">
          👕
          <button class="wish-remove" title="সরিয়ে দিন">✕</button>
        </div>
        <div class="wish-body">
          <h3 class="wish-title">ডিজাইনার প্রস্টেট পাঞ্জাবি</h3>
          <div class="wish-price">৳১,৮৫০</div>
          <a href="cart.html" class="btn-move-cart">কার্টে যুক্ত করুন</a>
        </div>
      </div>
    </div>
  </div>
</div>

<footer>
  <p>© ২০২৬ SeiRokom Fashion. সর্বস্বত্ব সংরক্ষিত।</p>
</footer>

</body>
</html>
