<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>উইশলিস্ট | SeiRokom Fashion</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --gold:#c9a24a; --gold-light:#e9cd8b; --cream:#faf8f4; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Hind Siliguri',sans-serif;background:#0d0d0d;color:var(--cream);}
  header{position:sticky;top:0;z-index:10;background:rgba(10,10,10,0.95);border-bottom:1px solid rgba(201,162,74,0.25);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;}
  header a.logo{color:var(--gold-light);text-decoration:none;font-size:1.1rem;font-weight:600;letter-spacing:1px;}
  header a.back{color:var(--cream);text-decoration:none;font-size:0.85rem;border:1px solid rgba(201,162,74,0.4);padding:6px 14px;border-radius:30px;}
  .wrap{max-width:820px;margin:0 auto;padding:30px 18px 80px;}
  h1{color:var(--gold-light);font-size:1.6rem;margin-bottom:6px;}
  .sub{color:#a8a196;font-size:0.9rem;margin-bottom:28px;}
  .wish-item{display:flex;justify-content:space-between;align-items:center;gap:14px;background:#161616;border:1px solid rgba(201,162,74,0.2);border-radius:12px;padding:16px;margin-bottom:12px;}
  .wish-item h3{margin:0 0 6px;font-size:1rem;color:var(--cream);}
  .wish-item .price{color:var(--gold);font-size:0.9rem;}
  .wish-actions{display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
  .btn-small{padding:8px 16px;border-radius:20px;font-size:0.8rem;font-weight:600;cursor:pointer;border:none;text-align:center;text-decoration:none;}
  .btn-add{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:#0d0d0d;}
  .btn-remove{background:none;border:1px solid #e07a7a;color:#e07a7a;}
  .empty{text-align:center;padding:60px 20px;color:#a8a196;}
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html">SR &nbsp;SEIROKOM FASHION</a>
  <a class="back" href="index.html">← শপিং চালিয়ে যান</a>
</header>

<div class="wrap">
  <h1>আপনার উইশলিস্ট</h1>
  <div class="sub">পছন্দের পণ্যগুলো এখানে সংরক্ষিত আছে।</div>
  <div id="wish-items"></div>
</div>

<script src="cart.js"></script>
<script src="extras.js"></script>
<script>
function renderWishlistPage() {
  const list = SRFWishlist.getWishlist();
  const el = document.getElementById('wish-items');

  if (list.length === 0) {
    el.innerHTML = '<div class="empty">আপনার উইশলিস্ট খালি।<br><br><a href="index.html" style="color:#e9cd8b;">শপিং শুরু করুন →</a></div>';
    return;
  }

  el.innerHTML = list.map(function(item) {
    return '<div class="wish-item">' +
      '<div>' +
        '<h3>' + item.name + '</h3>' +
        '<div class="price">' + SRFCart.formatTaka(item.price) + '</div>' +
      '</div>' +
      '<div class="wish-actions">' +
        '<button class="btn-small btn-add" onclick="SRFCart.addToCart(\'' + item.id + '\', \'' + item.name.replace(/'/g,"\\'") + '\', ' + item.price + '); SRFWishlist.removeFromWishlist(\'' + item.id + '\');">কার্টে যোগ করুন</button>' +
        '<button class="btn-small btn-remove" onclick="SRFWishlist.removeFromWishlist(\'' + item.id + '\')">মুছে ফেলুন</button>' +
      '</div>' +
    '</div>';
  }).join('');
}
document.addEventListener('DOMContentLoaded', renderWishlistPage);
</script>
</body>
</html>
