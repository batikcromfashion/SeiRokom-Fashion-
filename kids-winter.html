<style>
  :root{
    --gold:#c9a24a;
    --gold-light:#e9cd8b;
    --cream:#faf8f4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Hind Siliguri','Tiro Bangla',sans-serif;
    color:var(--cream);
    background:#0d0d0d;
  }
  header{
    position:sticky; top:0; z-index:10;
    background:rgba(10,10,10,0.9);
    backdrop-filter:blur(6px);
    border-bottom:1px solid rgba(201,162,74,0.25);
    padding:14px 20px;
    display:flex; align-items:center; justify-content:space-between;
  }
  header a.logo{
    color:var(--gold-light);
    text-decoration:none;
    font-size:1.15rem;
    letter-spacing:1px;
    font-weight:600;
  }
  header a.back{
    color:var(--cream);
    text-decoration:none;
    font-size:0.85rem;
    border:1px solid rgba(201,162,74,0.4);
    padding:6px 14px;
    border-radius:30px;
    transition:0.25s;
  }
  header a.back:hover{ background:var(--gold); color:#0d0d0d; }

  .winter-hero{
    position:relative;
    min-height:92vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    padding:50px 18px 70px;
    text-align:center;
    background:linear-gradient(-45deg,#0d0d0d,#1c2a44,#3a1414,#241505,#101820,#0d0d0d);
    background-size:400% 400%;
    animation:gradientShift 16s ease infinite;
  }
  @keyframes gradientShift{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }

  .snow span{
    position:absolute;
    top:-10px;
    display:block;
    background:var(--gold-light);
    border-radius:50%;
    opacity:0.7;
    animation:fall linear infinite;
  }
  @keyframes fall{
    0%{ transform:translateY(0) translateX(0); opacity:0.9;}
    100%{ transform:translateY(110vh) translateX(20px); opacity:0;}
  }

  .kicker{
    position:relative; z-index:2;
    color:var(--gold);
    letter-spacing:3px;
    font-size:0.8rem;
    text-transform:uppercase;
    margin-bottom:10px;
  }
  h1{
    position:relative; z-index:2;
    font-size:clamp(1.9rem,5vw,3rem);
    color:var(--gold-light);
    margin:0 0 12px;
  }
  p.lede{
    position:relative; z-index:2;
    max-width:56ch;
    color:#e6e1d6;
    font-size:1rem;
    margin:0 0 34px;
  }
  .frame{
    position:relative; z-index:2;
    max-width:920px;
    width:100%;
    border-radius:16px;
    overflow:hidden;
    border:1px solid rgba(201,162,74,0.45);
    box-shadow:0 24px 60px rgba(0,0,0,0.55);
  }
  .frame img{
    width:100%; display:block;
  }
  .cta-row{
    position:relative; z-index:2;
    margin-top:34px;
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .btn{
    display:inline-block;
    padding:13px 30px;
    border-radius:30px;
    font-size:0.95rem;
    text-decoration:none;
    transition:0.25s;
  }
  .btn-gold{
    background:linear-gradient(135deg,var(--gold),var(--gold-light));
    color:#0d0d0d;
    font-weight:600;
  }
  .btn-gold:hover{ transform:translateY(-2px); box-shadow:0 10px 24px rgba(201,162,74,0.35); }
  .btn-outline{
    border:1px solid rgba(250,248,244,0.5);
    color:var(--cream);
  }
  .btn-outline:hover{ background:rgba(250,248,244,0.1); }

  footer{
    text-align:center;
    padding:22px;
    font-size:0.8rem;
    color:#8a857a;
    background:#0d0d0d;
    border-top:1px solid rgba(201,162,74,0.15);
  }
</style>
</head>
