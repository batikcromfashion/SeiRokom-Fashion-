<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>চেকআউট | SeiRokom Fashion</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#c9a24a;--gold-light:#e9cd8b;--cream:#faf8f4}
*{box-sizing:border-box}body{margin:0;font-family:'Hind Siliguri',sans-serif;background:#0d0d0d;color:var(--cream)}
header{position:sticky;top:0;z-index:10;background:rgba(10,10,10,.96);border-bottom:1px solid rgba(201,162,74,.25);padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
header a{color:var(--cream);text-decoration:none}.logo{color:var(--gold-light)!important;font-weight:700}.back{border:1px solid rgba(201,162,74,.4);padding:6px 14px;border-radius:30px;font-size:.85rem}
.wrap{max-width:640px;margin:auto;padding:30px 18px 80px}h1{color:var(--gold-light);font-size:1.5rem}.sub{color:#a8a196;font-size:.88rem}
.order-summary{background:#161616;border:1px solid rgba(201,162,74,.25);border-radius:12px;padding:16px;margin:22px 0}
.line{display:flex;justify-content:space-between;gap:12px;font-size:.9rem;padding:5px 0}.total{font-weight:700;color:var(--gold-light);border-top:1px solid rgba(255,255,255,.1);margin-top:8px;padding-top:10px}
label{display:block;font-size:.85rem;color:#cfc9bd;margin:14px 0 6px}input,textarea{width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(201,162,74,.3);background:#161616;color:var(--cream);font:inherit}textarea{min-height:70px}
.pay-option{display:flex;align-items:center;gap:10px;background:#161616;border:1px solid rgba(201,162,74,.3);border-radius:10px;padding:12px 14px;margin-top:10px}
.btn{display:block;width:100%;padding:15px;border-radius:30px;font-weight:700;margin-top:22px;border:none;cursor:pointer;font-size:1rem}.gold{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:#0d0d0d}
.note{font-size:.78rem;color:#8a857a;text-align:center;margin-top:10px}.empty{text-align:center;padding:50px 20px;color:#a8a196}
</style>
</head>
<body>
<header><a class="logo" href="index.html">SR &nbsp; SEIROKOM FASHION</a><a class="back" href="cart.html">← কার্টে ফিরুন</a></header>
<div class="wrap" id="checkout-wrap">
<h1>চেকআউট</h1>
<div class="sub" id="checkout-sub">অর্ডার নিশ্চিত করতে আপনার তথ্য দিন।</div>
<div id="order-summary"></div>
<form id="checkout-form">
<label>পূর্ণ নাম *</label><input id="name" required placeholder="আপনার নাম">
<label>মোবাইল নম্বর *</label><input id="phone" type="tel" required placeholder="01XXXXXXXXX">
<label>সম্পূর্ণ ঠিকানা *</label><textarea id="address" required placeholder="বাসা/রোড, এলাকা, থানা, জেলা"></textarea>
<label>বিশেষ নির্দেশনা (ঐচ্ছিক)</label><textarea id="note" placeholder="অন্য কোনো নোট"></textarea>
<label style="margin-top:20px">পেমেন্ট পদ্ধতি *</label>
<div class="pay-option"><input type="radio" name="paymethod" value="cod" checked> ক্যাশ অন ডেলিভারি (COD)</div>
<div class="pay-option"><input type="radio" name="paymethod" value="bkash"> বিকাশ (bKash) — Send Money</div>
<div class="pay-option"><input type="radio" name="paymethod" value="nagad"> নগদ (Nagad) — Send Money</div>
<div id="pay-box" style="display:none;background:#1a1a1a;border:1px dashed rgba(201,162,74,.4);border-radius:10px;padding:14px;margin-top:12px">
<div id="pay-text"></div><label>Transaction ID *</label><input id="txnid" placeholder="Transaction ID">
</div>
<button class="btn gold" type="submit">অর্ডার কনফার্ম করুন (WhatsApp-এ পাঠান)</button>
<div class="note">কনফার্ম করলে অর্ডারের তথ্যসহ WhatsApp খুলবে।</div>
</form>
</div>
<script src="cart.js"></script>
<script>
(function(){
  const buyNowMode=new URLSearchParams(location.search).get("buyNow")==="1";
  const wrap=document.getElementById("checkout-wrap"), summary=document.getElementById("order-summary");
  const form=document.getElementById("checkout-form");
  const sub=document.getElementById("checkout-sub");
  let items=buyNowMode ? (SRFCart.getBuyNow()? [SRFCart.getBuyNow()]:[]) : SRFCart.getCart();

  if(buyNowMode) sub.textContent="আপনি যে পণ্যটি এখনই কিনতে চেয়েছেন, সেটির অর্ডার নিশ্চিত করুন।";

  function render(){
    if(!items.length){
      summary.innerHTML='<div class="empty">অর্ডার করার জন্য কোনো পণ্য নেই।<br><br><a href="index.html" style="color:#e9cd8b">শপিং শুরু করুন →</a></div>';
      form.style.display="none"; return;
    }
    let total=items.reduce((s,i)=>s+Number(i.price||0)*Number(i.qty||0),0);
    let rows=items.map(i=>{
      let opt="";
      if(i.size) opt+=" | সাইজ: "+i.size;
      if(i.color) opt+=" | রং: "+i.color;
      return '<div class="line"><span>'+i.name+opt+' × '+i.qty+'</span><span>'+SRFCart.formatTaka(i.price*i.qty)+'</span></div>';
    }).join("");
    summary.innerHTML='<div class="order-summary">'+rows+'<div class="line total"><span>সর্বমোট</span><span>'+SRFCart.formatTaka(total)+'</span></div></div>';
  }
  render();

  const numbers={bkash:"01645-008919 (Personal)",nagad:"01645-008919 (Personal)"};
  document.querySelectorAll('input[name="paymethod"]').forEach(r=>r.addEventListener("change",function(){
    const box=document.getElementById("pay-box"), tx=document.getElementById("txnid");
    if(this.value==="bkash"||this.value==="nagad"){
      document.getElementById("pay-text").textContent=(this.value==="bkash"?"বিকাশ":"নগদ")+" নম্বরে Send Money করুন: "+numbers[this.value];
      box.style.display="block";tx.required=true;
    }else{box.style.display="none";tx.required=false;}
  }));

  form.addEventListener("submit",function(e){
    e.preventDefault();
    const name=document.getElementById("name").value.trim(), phone=document.getElementById("phone").value.trim(), address=document.getElementById("address").value.trim(), note=document.getElementById("note").value.trim();
    const method=document.querySelector('input[name="paymethod"]:checked').value, txn=document.getElementById("txnid").value.trim();
    if((method==="bkash"||method==="nagad")&&!txn){alert("অনুগ্রহ করে Transaction ID লিখুন।");return;}
    const orderId=SRFCart.generateOrderId();
    const pay=method==="cod"?"ক্যাশ অন ডেলিভারি (COD)":(method==="bkash"?"বিকাশ":"নগদ")+" — Txn ID: "+txn;
    const customer={name,phone,address,note};
    let text="*নতুন অর্ডার - SeiRokom Fashion*\\nঅর্ডার আইডি: "+orderId+"\\n";
    text+=SRFCart.buildWhatsAppOrderText(customer,items);
    text+="\\nপেমেন্ট: "+pay;
    window.open("https://wa.me/8801645008919?text="+encodeURIComponent(text),"_blank");

    SRFCart.saveMyOrder(orderId);
    if(buyNowMode) SRFCart.clearBuyNow();
    else { SRFCart.clearCart(); SRFCart.removeCoupon(); }

    wrap.innerHTML='<div style="text-align:center;padding:50px 10px"><div style="font-size:2.4rem">✅</div><h1>অর্ডার তথ্য প্রস্তুত</h1><p style="color:#cfc9bd">WhatsApp-এ মেসেজটি পাঠিয়ে অর্ডার সম্পন্ন করুন।</p><div style="font-size:1.3rem;color:#e9cd8b;font-weight:700;margin:10px 0 24px">'+orderId+'</div><a href="order-tracking.html?id='+orderId+'" style="display:inline-block;background:linear-gradient(135deg,#c9a24a,#e9cd8b);color:#0d0d0d;font-weight:700;padding:13px 28px;border-radius:30px;text-decoration:none">অর্ডার ট্র্যাক করুন</a><br><br><a href="index.html" style="color:#a8a196">হোমপেজে ফিরুন</a></div>';
  });
})();
</script>
</body>
</html>
