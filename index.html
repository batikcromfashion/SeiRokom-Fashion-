<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polo T-Shirt Store</title>
  <style>
    /* Global Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f8;
      color: #333;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Product Grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    /* Product Card */
    .product-card {
      background: #fff;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
    }

    .product-card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 8px;
    }

    .product-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 12px 0 6px;
    }

    .product-price {
      font-size: 1.2rem;
      color: #007bff;
      font-weight: bold;
      margin-bottom: 12px;
    }

    /* Selector Section */
    .selector-group {
      margin-bottom: 12px;
    }

    .selector-label {
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 5px;
      color: #555;
    }

    .options {
      display: flex;
      gap: 8px;
    }

    /* Color Options */
    .color-btn {
      width: 25px;
      height: 25px;
      border-radius: 50%;
      border: 2px solid #ddd;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .color-btn.active {
      border-color: #000;
      box-shadow: 0 0 0 2px #007bff;
    }

    /* Size Options */
    .size-btn {
      padding: 5px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .size-btn.active {
      background: #007bff;
      color: #fff;
      border-color: #007bff;
    }

    /* Action Button Group */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 15px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      color: white;
      text-align: center;
      text-decoration: none;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-checkout {
      background: #25D366; /* WhatsApp Green Theme */
    }

    .btn-checkout:hover {
      background: #1ebc57;
    }

    .btn-details {
      background: #007bff;
    }

    .btn-details:hover {
      background: #0056b3;
    }

    /* Quick Menu Panel */
    .quick-menu-panel {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .quick-menu-panel.open {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 style="text-align: center; margin-bottom: 20px;">আমাদের পোলো টি-শার্ট কালেকশন</h1>

    <div class="product-grid">
      
      <!-- Product Card 1 -->
      <div class="product-card">
        <a href="product-polo-tshirt.html">
          <img src="https://via.placeholder.com/300x300" alt="Polo T-Shirt">
        </a>
        <h3 class="product-title">Classic Cotton Polo T-Shirt</h3>
        <p class="product-price">৳ ৯ ৯০</p>

        <!-- Color Selector -->
        <div class="selector-group">
          <div class="selector-label">কালার নির্বাচন করুন:</div>
          <div class="options">
            <button class="color-btn active" style="background-color: #000000;" data-color="Black"></button>
            <button class="color-btn" style="background-color: #0000FF;" data-color="Blue"></button>
            <button class="color-btn" style="background-color: #FF0000;" data-color="Red"></button>
          </div>
        </div>

        <!-- Size Selector -->
        <div class="selector-group">
          <div class="selector-label">সাইজ নির্বাচন করুন:</div>
          <div class="options">
            <button class="size-btn">M</button>
            <button class="size-btn active">L</button>
            <button class="size-btn">XL</button>
            <button class="size-btn">XXL</button>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="button-group">
          <!-- WhatsApp Order button redirects directly to checkout.html -->
          <a href="checkout.html" class="btn btn-checkout">WhatsApp এ অর্ডার করুন</a>
          <a href="product-polo-tshirt.html" class="btn btn-details">বিস্তারিত দেখুন</a>
        </div>
      </div>

    </div>
  </div>

  <!-- Interactive JavaScript -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // Size and Color selection functionality
      const sizeGroups = document.querySelectorAll('.product-card');

      sizeGroups.forEach(card => {
        const sizeBtns = card.querySelectorAll('.size-btn');
        const colorBtns = card.querySelectorAll('.color-btn');

        sizeBtns.forEach(btn => {
          btn.addEventListener('click', function () {
            sizeBtns.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
          });
        });

        colorBtns.forEach(btn => {
          btn.addEventListener('click', function () {
            colorBtns.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
          });
        });
      });
    });
  </script>
</body>
</html>
