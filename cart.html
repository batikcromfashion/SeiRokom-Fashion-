<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>আপনার কার্ট | SeiRokom Fashion</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --gold:#c9a24a; --gold-light:#e9cd8b; --cream:#faf8f4; --black:#0d0d0d; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Hind Siliguri',sans-serif;background:#0d0d0d;color:var(--cream);}
  header{position:sticky;top:0;z-index:10;background:rgba(10,10,10,0.95);border-bottom:1px solid rgba(201,162,74,0.25);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;}
  header a.logo{color:var(--gold-light);text-decoration:none;font-size:1.1rem;font-weight:600;letter-spacing:1px;}
  header a.back{color:var(--cream);text-decoration:none;font-size:0.85rem;border:1px solid rgba(201,162,74,0.4);padding:6px 14px;border-radius:30px;}
  .wrap{max-width:820px;margin:0 auto;padding:30px 18px 80px;}
  h1{color:var(--gold-light);font-size:1.6rem;margin-bottom:6px;}
  .sub{color:#a8a196;font-size:0.9rem;margin-bottom:28px;}
  .cart-item{display:flex;justify-content:space-between;align-items:center;gap:14px;background:#161616;border:1px solid rgba(201,162,74,0.2);border-radius:12px;padding:16px;margin-bottom:12px;}
  .cart-item h3{margin:0 0 6px;font-size:1rem;color:var(--cream);}
  .cart-item .price{color:var(--gold);font-size:0.9rem;}
  .qty-box{display:flex;align-items:center;gap:8px;}
  .qty-box button{width:28px;height:28px;border-radius:50%;border:1px solid var(--gold);background:transparent;color:var(--gold-light);font-size:1rem;cursor:pointer;}
  .qty-box span{min-width:20px;text-align:center;}
  .remove-btn{color:#e07a7a;background:none;border:none;font-size:0.8rem;cursor:pointer;margin-top:6px;text-decoration:underline;padding:0;}
  .empty{text-align:center;padding:60px 20px;color:#a8a196;}
  .summary{margin-top:24px;background:#161616;border:1px solid rgba(201,162,74,0.25);border-radius:12px;padding:20px;}
  .summary .row{display:flex;justify-content:space-between;margin-bottom:10px;font-size:0.95rem;}
  .summary .total{font-size:1.2rem;font-weight:700;color:var(--gold-light);border-top:1px solid rgba(255,255,255,0.1);padding-top:12px;margin-top:6px;}
  .btn{display:block;width:100%;text-align:center;padding:14px;border-radius:30px;font-weight:600;text-decoration:none;margin-top:16px;}
  .btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:#0d0d0d;}
  .btn-outline{border:1px solid rgba(250,248,244,0.4);color:var(--cream);background:none;cursor:pointer;}
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html">SR &nbsp;SEIROKOM FASHION</a>
  <a class="back" href="index.html">← শপিং চালিয়ে যান</a>
</header>

<div class="wrap">
  <h1>আপনার কার্ট</h1>
  <div class="sub">অর্ডার সম্পন্ন করার আগে পণ্যগুলো একবার দেখে নিন।</div>

  <div id="cart-items"></div>
  <div id="cart-summary"></div>
</div>

<script src="cart.js"></script>
<script>
function renderCartPage() {
  const cart = SRFCart.getCart();
  const itemsEl = document.getElementById('cart-items');
  const summaryEl = document.getElementById('cart-summary');

  if (cart.length === 0) {
    itemsEl.innerHTML = '<div class="empty">আপনার কার্ট খালি।<br><br><a href="index.html" style="color:#e9cd8b;">শপিং শুরু করুন →</a></div>';
    summaryEl.innerHTML = '';
    return;
  }

  itemsEl.innerHTML = cart.map(function(item) {
    return '<div class="cart-item">' +
      '<div>' +
        '<h3>' + item.name + '</h3>' +
        '<div class="price">' + SRFCart.formatTaka(item.price) + ' x ' + item.qty + ' = ' + SRFCart.formatTaka(item.price * item.qty) + '</div>' +
        '<button class="remove-btn" onclick="SRFCart.removeFromCart(\'' + item.id + '\')">মুছে ফেলুন</button>' +
      '</div>' +
      '<div class="qty-box">' +
        '<button onclick="SRFCart.updateQty(\'' + item.id + '\', ' + (item.qty - 1) + ')">−</button>' +
        '<span>' + item.qty + '</span>' +
        '<button onclick="SRFCart.updateQty(\'' + item.id + '\', ' + (item.qty + 1) + ')">+</button>' +
      '</div>' +
    '</div>';
  }).join('');

  const total = SRFCart.getCartTotal();
  summaryEl.innerHTML =
    '<div class="summary">' +
      '<div class="row"><span>মোট আইটেম</span><span>' + SRFCart.getCartCount() + '</span></div>' +
      '<div class="row total"><span>সর্বমোট</span><span>' + SRFCart.formatTaka(total) + '</span></div>' +
      '<a class="btn btn-gold" href="checkout.html">চেকআউট করুন →</a>' +
      '<button class="btn btn-outline" onclick="if(confirm(\'কার্ট খালি করবেন?\')) SRFCart.clearCart();">কার্ট খালি করুন</button>' +
    '</div>';
}
document.addEventListener('DOMContentLoaded', renderCartPage);
</script>
</body>
</html>
